name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build, e.g. v0.4.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Windows · signed NSIS release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: v__VERSION__
          releaseName: 'Nexus-Mixer v__VERSION__'
          releaseBody: |
            ## Nexus-Mixer v__VERSION__

            Windows-сборка с подписанным автообновлением.

            ### Установка
            Скачайте `Nexus-Mixer___VERSION___x64-setup.exe` и запустите.

            ### Автообновление
            Приложение само проверяет `latest.json` на GitHub Releases.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis
