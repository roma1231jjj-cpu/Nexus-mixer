<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101214" />
    <meta
      name="description"
      content="Nexus-Mixer — виртуальный аудиомикшер с ИИ-пресетами голоса. Nexus × АутSquad"
    />
    <title>Nexus-Mixer — Nexus × АутSquad</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <script>
      // Apply the persisted theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('nexus-mixer.theme')
        if (t === 'studio' || t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
